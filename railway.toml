# Railway / Railpack — Study AI worker (polls Supabase, calls OpenAI)
# Deploy the word-voyage-backend repo root (not word-adventure).

[build]
builder = "RAILPACK"

[deploy]
# Start Node directly (not `npm start`) so SIGTERM reaches the worker and
# exits 0 instead of npm reporting "signal SIGTERM" as a crash.
startCommand = "node --import tsx worker/src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
