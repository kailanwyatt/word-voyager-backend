# A string used to distinguish different Supabase projects on the same host.
project_id = "word-voyage-backend"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Disabled while Docker Desktop still has overlay I/O errors from a full-disk pull.
# Re-enable after quitting Docker Desktop (or Troubleshoot → Clean / Purge data).
[studio]
enabled = false
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["http://127.0.0.1:8081"]
jwt_expiry = 3600
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.study-api]
verify_jwt = true

[analytics]
enabled = false

[realtime]
enabled = false
